<button type="button" class="btn btn-ghost btn-square btn-sm" (click)="open()" aria-label="View code">
  <span class="material-symbols-outlined text-lg!" translate="no" aria-hidden="true">code</span>
</button>

<dialog #dialog class="modal">
  <div class="modal-box max-w-4xl w-11/12">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h3 class="font-bold text-lg">{{ title() }}</h3>
      <div class="flex items-center gap-1">
        <button type="button" class="btn btn-ghost btn-sm" (click)="copy()">
          <span class="material-symbols-outlined text-base!" translate="no" aria-hidden="true">
            {{ copied() ? 'check' : 'content_copy' }}
          </span>
          {{ copied() ? 'Copied' : 'Copy' }}
        </button>
        <form method="dialog">
          <button class="btn btn-ghost btn-square btn-sm" aria-label="Close">
            <span class="material-symbols-outlined text-lg!" translate="no" aria-hidden="true">close</span>
          </button>
        </form>
      </div>
    </div>

    @if (tsCode()) {
      <div role="tablist" class="tabs tabs-box mb-3">
        <button type="button" role="tab" class="tab" [class.tab-active]="activeTab() === 'html'" (click)="selectTab('html')">HTML</button>
        <button type="button" role="tab" class="tab" [class.tab-active]="activeTab() === 'ts'" (click)="selectTab('ts')">TypeScript</button>
      </div>
    }

    @if (isFormatting()) {
      <div class="mb-3 text-xs text-base-content/60">Formatting with Prettier...</div>
    }

    <pre
      class="bg-black rounded-box p-4 overflow-auto max-h-[70vh] text-sm font-mono whitespace-pre"
    ><code class="hljs bg-transparent! p-0!" [innerHTML]="highlightedCode()"></code></pre>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
