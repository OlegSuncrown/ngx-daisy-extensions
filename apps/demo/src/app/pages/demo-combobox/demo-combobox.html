<section>
  <h1 class="text-2xl font-bold">Combobox</h1>
  <p class="text-sm text-gray-500 mb-4">Accessible combobox with an editable search field inside a dialog popup.</p>

  <div class="flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Dialog combobox"
          [htmlCode]="simpleComboboxHtml"
          [tsCode]="simpleComboboxTs"
        />
        <div class="card-body">
          <app-simple-dialog-combobox />
        </div>
      </div>

      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Multi-select dialog combobox"
          [htmlCode]="multiComboboxHtml"
          [tsCode]="multiComboboxTs"
        />
        <div class="card-body">
          <app-multi-dialog-combobox />
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Async combobox"
          [htmlCode]="asyncComboboxHtml"
          [tsCode]="asyncComboboxTs"
        />
        <div class="card-body">
          <app-async-combobox />
        </div>
      </div>

      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Form combobox"
          [htmlCode]="formComboboxHtml"
          [tsCode]="formComboboxTs"
        />
        <div class="card-body">
          <app-form-combobox />
        </div>
      </div>
    </div>
  </div>
</section>
