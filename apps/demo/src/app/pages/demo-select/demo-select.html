<section>
  <h1 class="text-2xl font-bold">Select</h1>
  <p class="text-sm text-gray-500 mb-4">Accessible select control demo using the Daisy Extensions select components.</p>

  <div class="flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Single select"
          [htmlCode]="simpleSelectHtml"
          [tsCode]="simpleSelectTs"
        />
        <div class="card-body">
          <app-simple-select />
        </div>
      </div>

      <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
        <app-demo-code
          class="absolute top-1 right-1 z-10"
          title="Multi select"
          [htmlCode]="multiSelectHtml"
          [tsCode]="multiSelectTs"
        />
        <div class="card-body">
          <app-multi-select />
        </div>
      </div>
    </div>

    <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
      <app-demo-code
        class="absolute top-1 right-1 z-10"
        title="Sizes"
        [htmlCode]="selectSizesHtml"
        [tsCode]="selectSizesTs"
      />
      <div class="card-body">
        <app-select-sizes />
      </div>
    </div>

    <div class="card bg-base-100 card-border border-base-content/5 card-sm relative">
      <app-demo-code
        class="absolute top-1 right-1 z-10"
        title="Colors"
        [htmlCode]="selectColorsHtml"
        [tsCode]="selectColorsTs"
      />
      <div class="card-body">
        <app-select-colors />
      </div>
    </div>
  </div>
</section>
