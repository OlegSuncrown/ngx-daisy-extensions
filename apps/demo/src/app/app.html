<div class="drawer lg:drawer-open min-h-screen bg-base-200">
  <input id="app-drawer" type="checkbox" class="drawer-toggle" aria-label="Toggle navigation menu" />

  <div class="drawer-content flex min-h-screen flex-col">
    <header class="navbar sticky top-0 z-30 border-b border-base-300 bg-base-100/95 shadow-sm backdrop-blur">
      <div class="navbar-start gap-2">
        <label for="app-drawer" class="btn btn-square btn-ghost lg:hidden" aria-label="Open navigation menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </label>
        <a routerLink="/select" class="btn btn-ghost text-xl">Daisy Extensions</a>
      </div>

      <div class="navbar-end">
        <select
          class="select w-44"
          aria-label="Choose theme"
          [ngModel]="theme()"
          (ngModelChange)="theme.set($event)"
        >
          @for (themeOption of themes; track themeOption.value) {
            <option [value]="themeOption.value">{{ themeOption.label }}</option>
          }
        </select>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-6">
      <router-outlet />
    </main>
  </div>

  <aside class="drawer-side z-40">
    <label for="app-drawer" aria-label="Close navigation menu" class="drawer-overlay"></label>
    <nav class="min-h-full w-60 border-r border-base-300 bg-base-100 p-4 text-base-content">
      <div class="mb-6 px-2">
        <p class="text-xs font-semibold uppercase tracking-wide text-base-content/60">Components</p>
        <h1 class="text-2xl font-bold">Daisy Extensions</h1>
      </div>

      <ul class="menu rounded-box gap-1 w-full">
        <li>
          <a
            routerLink="/select"
            routerLinkActive="active bg-primary text-primary-content font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            Select
          </a>
        </li>
        <li>
          <a
            routerLink="/combobox"
            routerLinkActive="active bg-primary text-primary-content font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            Combobox
          </a>
        </li>
      </ul>
    </nav>
  </aside>
</div>
